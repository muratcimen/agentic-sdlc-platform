version: 1
runtime:
  image: streambank-sandbox:dev
  user: 10001
  readOnlyRootFilesystem: true
  network: none
  dockerSocket: false
  secrets: false
  maxDurationSeconds: 900
  cpuLimit: "1"
  memoryLimit: 1Gi
workspace:
  source: temporary-repository-copy
  writablePaths:
    - /workspace
commands:
  allow:
    - git status
    - git diff
    - git diff --check
    - ./mvnw test
    - ./mvnw verify
  deny:
    - docker
    - kubectl
    - oc
    - git push
    - git merge
    - unrestricted-shell
audit:
  recordToolInputHash: true
  recordDuration: true
  recordExitStatus: true
  redactSecrets: true
